package:
  name: node-streams
  publish:
    license: MIT
    version: 9.0.1
    location:
      githubOwner: purescript-node
      githubRepo: purescript-node-streams
  dependencies:
    - aff: ">=7.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.0.0 <7.0.0"
    - exceptions: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - node-buffer: ">=9.0.0 <10.0.0"
    - node-event-emitter: ">=3.0.0 <4.0.0"
    - nullable: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
    - st: ">=6.2.0 <7.0.0"
    - tailrec: ">=6.1.0 <7.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    # See also other tests
    #
    #     spago test --main Test.Main1
    #     spago test --main Test.Main2
    #     spago test --main Test.Main3 -- <(head --bytes 1000000 /dev/zero)
    #     spago test --main Test.Main4
    #
    dependencies:
      - assert
      - console
      - either
      - exceptions
      - node-buffer
      - node-process
      - partial
      - spec

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Main, --source, output, --out, output/purust_output, --threaded]
  packageSet:
    registry: 77.7.0
  extraPackages:
    exists:
      path: "../purust-exists"
    node-buffer:
      path: "../purust-node-buffer"
    aff:
      path: "../purust-aff"
    argonaut-core:
      path: "../purust-argonaut-core"
    arrays:
      path: "../purust-arrays"
    arraybuffer-types:
      path: "../purust-arraybuffer-types"
    assert:
      path: "../purust-assert"
    avar:
      path: "../purust-avar"
    catenable-lists:
      path: "../purust-catenable-lists"
    console:
      path: "../purust-console"
    datetime:
      path: "../purust-datetime"
    effect:
      path: "../purust-effect"
    enums:
      path: "../purust-enums"
    exceptions:
      path: "../purust-exceptions"
    foldable-traversable:
      path: "../purust-foldable-traversable"
    foreign:
      path: "../purust-foreign"
    foreign-object:
      path: "../purust-foreign-object"
    functions:
      path: "../purust-functions"
    integers:
      path: "../purust-integers"
    js-promise:
      path: "../purust-js-promise"
    js-promise-aff:
      path: "../purust-js-promise-aff"
    js-uri:
      path: "../purust-js-uri"
    lazy:
      path: "../purust-lazy"
    node-event-emitter:
      path: "../purust-node-event-emitter"
    node-fs:
      path: "../purust-node-fs"
    node-http:
      path: "../purust-node-http"
    node-net:
      path: "../purust-node-net"
    node-path:
      path: "../purust-node-path"
    node-process:
      path: "../purust-node-process"
    now:
      path: "../purust-now"
    nullable:
      path: "../purust-nullable"
    numbers:
      path: "../purust-numbers"
    partial:
      path: "../purust-partial"
    prelude:
      path: "../purust-prelude"
    random:
      path: "../purust-random"
    record:
      path: "../purust-record"
    refs:
      path: "../purust-refs"
    run:
      path: "../purust-run"
    simple-json:
      path: "../purust-simple-json"
    spec:
      path: "../purust-spec"
    st:
      path: "../purust-st"
    strings:
      path: "../purust-strings"
    test:
      path: "../purust-test"
    unfoldable:
      path: "../purust-unfoldable"
    unsafe-coerce:
      path: "../purust-unsafe-coerce"
    uuid:
      path: "../purust-uuid"
    variant:
      path: "../purust-variant"
    yoga-json:
      path: "../purust-yoga-json"
